<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" windowtype="zotero:reading-room">
  <head>
    <meta charset="UTF-8" />
    <title>Reading Room · 论文阅读室</title>
    <script src="chrome://zotero/content/include.js"></script>
    <style type="text/css">
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f4f7f5;
        color: #55716c;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      #rr-boot {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="rr-boot">正在载入论文阅读室…</div>
    <script type="application/javascript">
      // <![CDATA[
      (function () {
        "use strict";
        var attempts = 0;
        var timer = setInterval(function () {
          var api = window.Zotero && window.Zotero.ReadingRoom;
          if (api && typeof api.mountWindow === "function") {
            clearInterval(timer);
            try {
              window.MozXULElement.insertFTLIfNeeded("reading-room.ftl");
            }
            catch (_) {}
            api.mountWindow(window);
            return;
          }
          if (++attempts >= 40) {
            clearInterval(timer);
            document.getElementById("rr-boot").textContent =
              "论文阅读室脚本尚未就绪。请重新启用插件后查看 Zotero 错误控制台。";
          }
        }, 100);
      })();
      // ]]>
    </script>
  </body>
</html>
